name: resref

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in postgres.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in postgres.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in postgres.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - resref_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resref_postgres_data:
